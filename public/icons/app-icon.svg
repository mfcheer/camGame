<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
<title id="title">彩虹小队 · 森林大解救</title>
<desc id="desc">纯薄荷绿底板上，立体的小白兔从彩虹泡泡里探出头，右上方亮起触碰星光</desc>
<defs>
  <linearGradient id="glass" x1=".12" y1=".06" x2=".88" y2=".95"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#d7fcff" stop-opacity=".22"/><stop offset="1" stop-color="#b1c7ff" stop-opacity=".38"/></linearGradient>
  <linearGradient id="rim" x1=".1" y1=".18" x2=".91" y2=".85"><stop stop-color="#fc7f92"/><stop offset=".32" stop-color="#ffc263"/><stop offset=".61" stop-color="#76d9d5"/><stop offset="1" stop-color="#8eaef7"/></linearGradient>
  <linearGradient id="fur" x1=".12" y1=".06" x2=".87" y2=".95"><stop stop-color="#fff"/><stop offset=".62" stop-color="#fff9ed"/><stop offset="1" stop-color="#dcd9d2"/></linearGradient>
  <linearGradient id="ear" x1=".12" y1="0" x2=".85" y2="1"><stop stop-color="#fff"/><stop offset=".62" stop-color="#f7f1e8"/><stop offset="1" stop-color="#cbc8c6"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffd2dd"/><stop offset=".7" stop-color="#f797b2"/><stop offset="1" stop-color="#e37c9b"/></linearGradient>
  <radialGradient id="eye" cx=".31" cy=".21" r=".9"><stop stop-color="#5e4244"/><stop offset=".54" stop-color="#29252e"/><stop offset="1" stop-color="#171923"/></radialGradient>
  <linearGradient id="gold" x1=".08" y1="0" x2=".9" y2="1"><stop stop-color="#fff5aa"/><stop offset=".42" stop-color="#ffce54"/><stop offset="1" stop-color="#dc861e"/></linearGradient>
  <radialGradient id="star" cx=".3" cy=".2" r=".84"><stop stop-color="#fffbdc"/><stop offset=".52" stop-color="#ffe876"/><stop offset="1" stop-color="#ffad4c"/></radialGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#206b69" flood-opacity=".23"/></filter>
  <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="1" dy="8" stdDeviation="6" flood-color="#65717a" flood-opacity=".22"/></filter>
</defs>
<!-- The tile itself uses a single, flat colour. -->
<rect width="512" height="512" rx="112" fill="#76d7c9"/>
<ellipse cx="256" cy="447" rx="157" ry="22" fill="#2b8e85" opacity=".18"/>
<g filter="url(#shadow)">
  <circle cx="256" cy="272" r="176" fill="url(#glass)" stroke="url(#rim)" stroke-width="14"/>
  <circle cx="256" cy="272" r="166" fill="none" stroke="#fff" stroke-width="4" opacity=".72"/>
  <path d="M126 200c24-48 70-77 120-81" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".72"/>
  <path d="M349 383c-14 11-31 19-50 24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".5"/>
</g>
<!-- Tall ears and a compact body keep the rabbit clear at small sizes. -->
<g filter="url(#softShadow)">
  <path d="M200 221C180 175 159 81 175 55c18-26 56 41 68 131l-2 54Z" fill="url(#ear)" stroke="#eee9df" stroke-width="3"/>
  <path d="M200 204c-12-42-27-118-18-134 12-8 36 64 45 128Z" fill="url(#pink)"/>
  <path d="M318 222c20-46 40-141 24-167-18-26-56 41-68 131l2 54Z" fill="url(#ear)" stroke="#eee9df" stroke-width="3"/>
  <path d="M318 204c12-42 27-118 18-134-12-8-36 64-45 128Z" fill="url(#pink)"/>
  <ellipse cx="256" cy="397" rx="91" ry="62" fill="url(#fur)"/>
  <ellipse cx="256" cy="405" rx="58" ry="37" fill="#fff" opacity=".66"/>
  <ellipse cx="256" cy="277" rx="111" ry="112" fill="url(#fur)"/>
  <ellipse cx="202" cy="233" rx="29" ry="51" transform="rotate(27 202 233)" fill="#fff" opacity=".44"/>
</g>
<g transform="rotate(-10 256 187)" filter="url(#softShadow)">
  <path d="M224 188 221 158 239 171 255 145 271 171 290 158 287 188Z" fill="url(#gold)" stroke="#d18b34" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M225 181h61v11h-61z" fill="#e8a930"/><path d="M228 183h56" stroke="#fff4bc" stroke-width="3" stroke-linecap="round"/>
  <circle cx="255" cy="176" r="5" fill="#f37e91"/>
</g>
<!-- Glossy eyes, plump cheeks and an inset muzzle give the face depth. -->
<ellipse cx="212" cy="274" rx="24" ry="29" fill="#e9e1d8" opacity=".7"/>
<ellipse cx="300" cy="274" rx="24" ry="29" fill="#e9e1d8" opacity=".7"/>
<ellipse cx="212" cy="269" rx="22" ry="27" fill="url(#eye)"/><ellipse cx="300" cy="269" rx="22" ry="27" fill="url(#eye)"/>
<ellipse cx="205" cy="260" rx="8" ry="10" fill="#fff"/><ellipse cx="293" cy="260" rx="8" ry="10" fill="#fff"/>
<circle cx="222" cy="279" r="3" fill="#fff" opacity=".8"/><circle cx="310" cy="279" r="3" fill="#fff" opacity=".8"/>
<ellipse cx="180" cy="309" rx="18" ry="11" fill="#f6a4b6" opacity=".66"/><ellipse cx="332" cy="309" rx="18" ry="11" fill="#f6a4b6" opacity=".66"/>
<ellipse cx="237" cy="313" rx="28" ry="23" fill="#fffef8"/><ellipse cx="275" cy="313" rx="28" ry="23" fill="#fffef8"/>
<path d="M244 305q12-10 24 0-3 10-12 11-9-1-12-11Z" fill="#e98299"/>
<path d="M256 316v8m0 0q-8 10-19 3m19-3q8 10 19 3" fill="none" stroke="#88636b" stroke-width="3.5" stroke-linecap="round"/>
<g filter="url(#softShadow)">
  <ellipse cx="176" cy="391" rx="39" ry="29" transform="rotate(-18 176 391)" fill="url(#fur)"/>
  <ellipse cx="336" cy="391" rx="39" ry="29" transform="rotate(18 336 391)" fill="url(#fur)"/>
  <path d="M159 383q15-14 31-9m132 0q16-5 31 9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
</g>
<g filter="url(#softShadow)">
  <path d="m393 130 8 22 22 8-22 8-8 22-8-22-22-8 22-8Z" fill="url(#star)" stroke="#fff7c9" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="439" cy="125" r="5" fill="#fff"/><circle cx="433" cy="186" r="3" fill="#fff6bc"/>
</g>
</svg>
