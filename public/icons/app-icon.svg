<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="iconTitle iconDesc">
  <title id="iconTitle">彩虹小队 · 森林大解救</title>
  <desc id="iconDesc">薄荷森林背景上，头戴胜利金冠的小白兔在彩虹泡泡中欢笑，带有指尖魔法星光</desc>
  <defs>
    <!-- 背景渐变：森林薄荷清新绿 -->
    <linearGradient id="bgGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="45%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- 背景微光射线 -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 泡泡彩虹流光环 -->
    <linearGradient id="rainbowRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="20%" stop-color="#fb923c"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="65%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- 泡泡球体玻璃质感 -->
    <radialGradient id="bubbleGlass" cx="0.32" cy="0.25" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#f0fdf4" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#e0f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fdf2f8" stop-opacity="0.4"/>
    </radialGradient>

    <!-- 兔子毛发质感 -->
    <linearGradient id="bunnyFur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- 兔耳内侧柔粉 -->
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- 皇冠黄金渐变 -->
    <linearGradient id="goldCrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#064e3b" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 圆角图标底板 (iOS/macOS 标准 116px 优雅曲率) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#sunGlow)"/>

  <!-- 背景漂浮微小彩虹光泡 -->
  <circle cx="86" cy="118" r="22" fill="#ffffff" opacity="0.3"/>
  <circle cx="86" cy="118" r="22" fill="none" stroke="url(#rainbowRing)" stroke-width="3" opacity="0.6"/>
  <circle cx="432" cy="386" r="28" fill="#ffffff" opacity="0.25"/>
  <circle cx="432" cy="386" r="28" fill="none" stroke="url(#rainbowRing)" stroke-width="4" opacity="0.5"/>
  <circle cx="98" cy="406" r="14" fill="#ffffff" opacity="0.2"/>

  <!-- 2. 主彩虹大泡泡与小兔组 -->
  <g filter="url(#softShadow)">
    <!-- 泡泡彩虹外环与玻璃球底 -->
    <circle cx="256" cy="272" r="162" fill="url(#bubbleGlass)"/>
    <circle cx="256" cy="272" r="162" fill="none" stroke="url(#rainbowRing)" stroke-width="12" opacity="0.95"/>
    <circle cx="256" cy="272" r="156" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75"/>

    <!-- 3. 小白兔主体 (身体、耳朵、胜利金冠、面部表情) -->
    <!-- 兔子耳朵 -->
    <!-- 左耳 -->
    <g transform="rotate(-14 206 142)">
      <ellipse cx="206" cy="142" rx="34" ry="86" fill="url(#bunnyFur)" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2"/>
      <ellipse cx="206" cy="142" rx="18" ry="62" fill="url(#earInner)"/>
    </g>
    <!-- 右耳 -->
    <g transform="rotate(14 306 142)">
      <ellipse cx="306" cy="142" rx="34" ry="86" fill="url(#bunnyFur)" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2"/>
      <ellipse cx="306" cy="142" rx="18" ry="62" fill="url(#earInner)"/>
    </g>

    <!-- 胜利 3D 黄金小王冠 (核心奖励元素) -->
    <g transform="translate(256, 172)">
      <path d="M-36,0 L-26,-28 L-10,-12 L0,-34 L10,-12 L26,-28 L36,0 Z" fill="url(#goldCrown)" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="-36" y="-1" width="72" height="9" rx="4.5" fill="#f59e0b"/>
      <!-- 王冠宝石 -->
      <circle cx="0" cy="-24" r="4.5" fill="#ef4444"/>
      <circle cx="-24" cy="-18" r="3.5" fill="#38bdf8"/>
      <circle cx="24" cy="-18" r="3.5" fill="#38bdf8"/>
      <circle cx="0" cy="3.5" r="2.5" fill="#ffffff"/>
      <circle cx="-18" cy="3.5" r="2" fill="#ffffff"/>
      <circle cx="18" cy="3.5" r="2" fill="#ffffff"/>
    </g>

    <!-- 兔子头部 -->
    <ellipse cx="256" cy="288" rx="98" ry="94" fill="url(#bunnyFur)"/>

    <!-- 软糯萌萌大眼睛 -->
    <!-- 左眼 -->
    <ellipse cx="212" cy="276" rx="13" ry="17" fill="#1e293b"/>
    <circle cx="208" cy="270" r="5.5" fill="#ffffff"/>
    <circle cx="216" cy="283" r="2.5" fill="#ffffff"/>
    <!-- 右眼 -->
    <ellipse cx="300" cy="276" rx="13" ry="17" fill="#1e293b"/>
    <circle cx="296" cy="270" r="5.5" fill="#ffffff"/>
    <circle cx="304" cy="283" r="2.5" fill="#ffffff"/>

    <!-- 娇羞粉嫩小腮红 -->
    <ellipse cx="184" cy="302" rx="16" ry="10" fill="#f472b6" opacity="0.6"/>
    <ellipse cx="328" cy="302" rx="16" ry="10" fill="#f472b6" opacity="0.6"/>

    <!-- 小鼻子与微笑嘴巴 -->
    <ellipse cx="256" cy="298" rx="7" ry="5" fill="#fb7185"/>
    <path d="M256,303 L256,310 M256,310 Q245,321 236,311 M256,310 Q267,321 276,311" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 趴在泡泡边缘的两只圆润小肉爪 -->
    <ellipse cx="186" cy="372" rx="26" ry="20" transform="rotate(-15 186 372)" fill="url(#bunnyFur)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="326" cy="372" rx="26" ry="20" transform="rotate(15 326 372)" fill="url(#bunnyFur)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- 4. 泡泡球体弧形高光反射 (增强立体透亮质感) -->
    <path d="M142,206 A140,140 0 0,1 276,140" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="344" cy="364" rx="18" ry="8" transform="rotate(-35 344 364)" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- 5. 食指触碰与魔法流光星芒 (代表核心体感玩法：伸手触碰彩虹泡泡) -->
  <g filter="url(#glow)">
    <!-- 触碰光核与光波 -->
    <circle cx="388" cy="168" r="18" fill="#ffffff" opacity="0.9"/>
    <circle cx="388" cy="168" r="30" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.75"/>

    <!-- 4 角星芒 -->
    <path d="M388,136 L393,163 L420,168 L393,173 L388,200 L383,173 L356,168 L383,163 Z" fill="#fef08a"/>
    <path d="M388,146 L391,165 L410,168 L391,171 L388,190 L385,171 L366,168 L385,165 Z" fill="#ffffff"/>

    <!-- 飞舞小星光 -->
    <path d="M428,124 L430,134 L440,136 L430,138 L428,148 L426,138 L416,136 L426,134 Z" fill="#fef08a" opacity="0.9"/>
    <circle cx="352" cy="132" r="4" fill="#ffffff"/>
    <circle cx="426" cy="186" r="3" fill="#fde047"/>
    <circle cx="362" cy="204" r="2.5" fill="#ffffff"/>
  </g>
</svg>
