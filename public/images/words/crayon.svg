        <ellipse cx="0" cy="2" rx="10" ry="16" fill="#2ECC71"/>
        <line x1="-12" y1="-30" x2="12" y2="-30" stroke="#1F618D" stroke-width="3"/>
        <line x1="-12" y1="36" x2="12" y2="36" stroke="#1F618D" stroke-width="3"/>
