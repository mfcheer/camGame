        <line x1="-36" y1="22" x2="-24" y2="24" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
        <line x1="-36" y1="28" x2="-24" y2="27" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
