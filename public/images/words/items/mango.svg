            <stop offset="100%" stop-color="#E64A19" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="leafGrad_mango" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#81C784"/>
            <stop offset="100%" stop-color="#388E3C"/>
