        </defs>
        <!-- Stem -->
        <path d="M-10 -72 C-8 -88 4 -96 14 -94 C12 -88 6 -80 -2 -68" fill="#6D4C41" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>
