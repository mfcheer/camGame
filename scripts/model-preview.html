<!doctype html><meta charset="utf-8"><style>body{margin:0;background:transparent}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import {createRabbitModel} from '/src/rabbitModel.js';
import {ANIMAL_MODELS} from '/src/rescueAnimal.js';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(384,384);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xe5f6ff,0xb7a483,1.9));const key=new THREE.DirectionalLight(0xffefd6,2.6);key.position.set(-3,6,5);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,.6);fill.position.set(4,1,3);scene.add(fill);

const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(center.x,center.y+.08,center.z+Math.max(size.x,size.y)*1.6);camera.lookAt(center);renderer.render(scene,camera);window.previewReady=true;
</script>
