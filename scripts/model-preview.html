<!doctype html><meta charset="utf-8"><style>body{margin:0;background:transparent}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import {createRabbitModel} from '/src/rabbitModel.js';
import {ANIMAL_MODELS} from '/src/rescueAnimal.js';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(384,384);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xe5f6ff,0xb7a483,1.9));const key=new THREE.DirectionalLight(0xffefd6,2.6);key.position.set(-3,6,5);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,.6);fill.position.set(4,1,3);scene.add(fill);
const params=new URLSearchParams(location.search);
const id=params.get('animal');const factory=ANIMAL_MODELS[id]||createRabbitModel;const model=factory();model.rotation.y=id==='krashy'?.22:id==='triceratops'?.38:id==='tayo'?.36:id==='mcqueen'?.42:id==='excavator'?-.28:.2;scene.add(model);
if(params.get('happy')==='1'){
  const hm=model.getObjectByName('Happy_Mouth');const ht=model.getObjectByName('Happy_Tongue');
  if(hm)hm.visible=true;if(ht)ht.visible=true;
  for(const name of ['Mouth','Smile','Mouth_Stem','Smile_L','Smile_R','Pig_Smile','Wolf_Mouth','Wolf_Smile','Wolf_Grin_Teeth']){
    const m=model.getObjectByName(name);if(m)m.visible=false;
  }
}
const targetObj=(params.get('closeup')==='1'&&(model.getObjectByName('Head')||model.getObjectByName('Round_Train_Face')))||model;
const bounds=new THREE.Box3().setFromObject(targetObj),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());const camera=new THREE.PerspectiveCamera(40,1,.1,100);
const framing=params.get('closeup')==='1'?1.8:(id==='maiqi'?1.48:id==='krashy'?1.45:id==='triceratops'?1.52:id==='tayo'?1.42:id==='excavator'?1.47:id==='mcqueen'?1.26:['dragon','goldenDragon','jett'].includes(id)?1.72:1.55);
camera.position.set(center.x,center.y+(params.get('closeup')==='1'?0:.06),center.z+size.z/2+Math.max(size.x,size.y)*framing);camera.lookAt(center);
renderer.render(scene,camera);window.previewReady=true;window.previewModel=model;
</script>
